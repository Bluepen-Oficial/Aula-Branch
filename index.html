
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>O GATO</title>

<style>
    body {
        background: #b8d8ff;
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 40px;
    }

    h1 {
        color: #222;
        font-size: 45px;
    }

    .cartao {
        background: white;
        max-width: 400px;
        margin: auto;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 5px 5px 0px #555;
    }

    img {
        width: 100%;
        border-radius: 15px;
    }

    button {
        background: black;
        color: white;
        padding: 15px 25px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 18px;
        margin-top: 15px;
    }

    button:hover {
        background: #555;
    }

    #resposta {
        font-size: 22px;
        font-weight: bold;
    }
</style>
</head>

<body>

<h1>OLHE PARA ESTE GATO</h1>

<div class="cartao">

    <img
      src="https://images.rawpixel.com/image_social_landscape/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIzLTEyL2FuZ3VzdGVvd19waG90b19vZl9jdXRlX2dpbmdlcl9jYXRfc2l0dGluZ19hbmRfbG9va2luZ19hdF90aGVfY18yNDRmYzlkYy02NTkxLTRmOGItYjAyZi05OWZiZTEyNTgxNDRfMS5qcGc.jpg"
      alt="Foto de um gato laranja">

    <h2>GERALDO</h2>

    <p>Idade: 4 anos</p>
    <p>Profissão: Comer e dormir</p>
    <p>Estado civil: Casado com o sachê</p>

    <button onclick="gato()">FALAR COM GERALDO</button>

    <p id="resposta"></p>

</div>

<script>
function gato() {
    const frases = [
        "MIAU.",
        "Me dê comida.",
        "Você está no meu território.",
        "Não sou seu amigo.",
        "Quero dormir.",
        "Derrubei seu copo.",
        "Miau miau miau.",
        "Respeite minha autoridade."
    ];

    document.getElementById("resposta").innerText =
        frases[Math.floor(Math.random() * frases.length)];
}
</script>

</body>
</html>
